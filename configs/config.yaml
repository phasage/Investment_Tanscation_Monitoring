project:
  name: investment-transaction-monitoring
  version: "0.1.0"
  description: AI/ML system for monitoring investment transactions

data:
  raw_path: data/raw
  processed_path: data/processed
  features_path: data/features
  external_path: data/external
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42

features:
  transaction:
    - transaction_amount
    - transaction_type
    - asset_class
    - counterparty_id
    - portfolio_id
    - timestamp
    - currency
  derived:
    - amount_zscore
    - rolling_avg_7d
    - rolling_std_7d
    - tx_frequency_1h
    - tx_frequency_24h
    - counterparty_risk_score
    - portfolio_concentration
    - time_since_last_tx

models:
  anomaly_detection:
    algorithm: isolation_forest
    contamination: 0.05
    n_estimators: 200
    random_state: 42

  risk_scoring:
    algorithm: xgboost
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: auc
    early_stopping_rounds: 20

  fraud_detection:
    algorithm: lightgbm
    n_estimators: 500
    num_leaves: 63
    learning_rate: 0.03
    class_weight: balanced

thresholds:
  anomaly_score: 0.75
  risk_score_high: 0.80
  risk_score_medium: 0.50
  fraud_probability: 0.70

monitoring:
  drift_detection: true
  drift_threshold: 0.10
  performance_check_interval_hours: 24
  alert_on_drift: true

api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  timeout: 30

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: logs/app.log
  rotation: "100 MB"
  retention: "30 days"
